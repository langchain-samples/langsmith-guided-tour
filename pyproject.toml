[project]
name = "langsmith-guided-tour"
version = "0.1.0"
description = "Hands-on LangSmith POC modules built around one client-research deep agent"
requires-python = ">=3.11"
dependencies = [
    "agentevals>=0.0.9",
    "deepagents[quickjs]>=0.7.32",
    "grandalf>=0.8",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.0",
    "jupyter>=1.1.1",
    "langchain[mcp]>=1.4.9",
    "langchain-anthropic>=1.7.9",
    "langchain-aws>=1.0.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.0.1",
    "langgraph-cli[inmem]>=0.4.41",
    "langsmith>=0.14.17",
    "notebook>=7.4.7",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0",
    "tavily-python>=0.7.21",
]

[tool.setuptools]
packages = ["agents", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
