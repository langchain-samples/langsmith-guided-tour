[project]
name = "modular-workshops"
version = "0.1.0"
description = "Mix-and-match LangChain workshop modules for ~1.5 hour customer workshops"
requires-python = ">=3.12"
dependencies = [
    # Upper-bounded: 0.7 removed backend factories, and the deploy image
    # resolves independently of the local venv -- an unbounded pin lets them drift.
    "deepagents>=0.6,<0.8",
    "deepagents-cli",
    "grandalf>=0.8",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.0",
    "jupyter>=1.1.1",
    "langchain>=1.0.1",
    "langchain-anthropic>=1.0.0",
    "langchain-aws>=1.0.0",
    "langchain-community>=0.4",
    "langchain-openai>=1.0.1",
    "langgraph>=1.0.1",
    "langgraph-cli[inmem]>=0.4.21",
    "langsmith>=0.4.37",
    "notebook>=7.4.7",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0",
    "tavily-python>=0.7.21",
]

# Harbor (Module 3, Part B) is a dependency *group*, not a project dependency:
# `uv sync` installs it, but the LangGraph deploy image builds with
# `uv pip install -e .`, which reads [project.dependencies] only -- so harbor's
# tree stays out of an image that never uses it.
[dependency-groups]
harbor = ["harbor[langsmith]>=0.21.0"]

[tool.uv]
default-groups = ["harbor"]

[tool.setuptools]
packages = ["agents", "utils"]
